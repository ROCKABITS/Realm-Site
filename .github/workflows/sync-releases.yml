name: Refresh mod releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-releases.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: release-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realm-studios-site
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run sync:releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate refreshed catalogue
        run: |
          npm run check
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Publish only validated metadata
        run: |
          git add src/data/releases.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh published mod versions'
          git push origin HEAD:realm-studios-site
